aid: adimab
name: Adimab
description: 'Adimab is a private biotechnology company founded in 2007, headquartered
  in Lebanon, New Hampshire, with a west coast office in Mountain View, California.
  It operates a proprietary yeast-based antibody discovery and engineering platform
  that combines fully human synthetic and immune libraries to generate specific, stable
  and developable IgGs, heavy-chain antibodies (HCAbs), multispecifics, T-cell engagers
  and T-cell receptors. Adimab deliberately runs no internal therapeutic pipeline,
  instead partnering with biopharma companies through funded discovery programs, platform
  transfer and non-exclusive program deals. The company reports more than 140 industry
  partnerships since 2009, 675+ therapeutic programs initiated, 90+ clinical programs
  and 6 commercial products. Adimab publishes no public developer API, SDK, developer
  portal or machine-readable API contract; its capabilities are delivered as laboratory
  discovery services and licensed platform transfer under partnership agreements.'
